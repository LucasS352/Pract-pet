server {
    listen 3531;
    server_name _;

    # Permite uploads de até 10MB (logos, imagens, etc)
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Compatibilidade com PWAs anteriores que ainda consultam /api sem a barra.
    # Rewrite interno: não expõe http://host:3521 em um Location para clientes HTTPS.
    location = /api {
        rewrite ^ /api/ last;
    }

    # Proxy /api/ → backend (prioridade máxima com ^~)
    location ^~ /api/ {
        proxy_pass http://backend:3530;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Buffer adequado para respostas grandes (imagens, uploads)
        proxy_buffer_size       32k;
        proxy_buffers           16 64k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;
    }

    # Servir /uploads/ estaticamente pelo NGINX (bypassa Node.js)
    location ^~ /uploads/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # sw.js e manifest — NUNCA cachear no navegador ou proxy
    location ~* (sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Cache para assets estáticos do Vite (js, css, fontes — em /assets/)
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # sys-init — NUNCA cachear (página admin, bypassa Service Worker)
    location = /sys-init {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    # SPA fallback — index.html NUNCA deve ser cacheado pelo HTTP cache para permitir atualizações instantâneas
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri /index.html;
    }
}
